baseURL = 'https://bxycode000.github.io/'
locale = 'en-us'
title = 'Lyi'
theme = 'hugo-theme-reimu'
defaultContentLanguage = 'zh-CN'
enableEmoji = 'true'
[languages]
[languages.zh-CN]
locale = 'zh-CN'
label = '简体中文'
weight = 1
hasCJKLanguage = 'true'
title = 'Lyi'
author = 'Verdiluxen_Lyi'

[languages.en]
locale = 'en'
label = 'English'
weight = 2
hasCJKLanguage = 'true'
title = 'Lyi'
author = 'Verdiluxen_Lyi'

[languages.ja]
locale = 'ja'
label = '日本語'
weight = 3
hasCJKLanguage = 'true'
title = 'Lyi'                                      # 自己编辑
author = 'Lyi'                                     # 自己编辑

[markup.highlight]
guessSyntax = 'true'
noClasses = 'false'

[markup.goldmark.extensions.passthrough]
enable = 'true'
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[outputs]
home = ["Algolia", "HTML", "RSS"]

[outputFormats.Algolia]
baseName = "algolia"
isPlainText = 'true'
mediaType = "application/json"
notAlternative = 'true'

[markup]
  [markup.tableOfContents]
    endLevel = 4
    ordered = 'true'
    startLevel = 1