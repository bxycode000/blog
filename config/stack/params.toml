mainSections   = ["post"]
rssFullContent = true
favicon        = "/favicon.ico"

[footer]
    since = 2026

[sidebar]
    emoji    = "✏️"
    avatar   = "/images/avatar.jpg"

[article]
    [article.license]
        enabled = true
        default = "Licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[comments]
    # 评论系统暂未配置，启用方法见 Stack 文档 comments 部分
    enabled = false

[cookies]
    enabled = false
