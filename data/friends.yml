# =========================================================
# 友链数据 · data/friends.yml
# =========================================================
# 每条友链支持以下字段：
#   name        必填 · 站点名称
#   url         必填 · 站点地址（记得带 https://）
#   avatar      可选 · 头像图片地址；留空或加载失败时显示名称首字占位
#   description 可选 · 一句话简介
#   note        可选 · 备注（相识缘由、更新情况等），显示在卡片底部
#
# 添加新友链：照着下面的格式在文件末尾追加一条即可，构建时会自动渲染。
# 示例（目前仅 1 条，其余请按需补充）：

- name: 第三夏尔 | Third Shire
  url: https://thirdshire.com/
  avatar: https://thirdshire.com/blackcat_avatar.jpg
  description: 认真生活，积极摸鱼
  note: 这次设计参考的博客
