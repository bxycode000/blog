{{- $item := . -}}
{{- $cover := $item.cover | default "" -}}
{{- $singers := delimit ($item.singers | default slice) " / " -}}
<button class="wuyu-card wuyu-card--music" type="button" data-wuyu-open="wuyu-{{ $item.kind }}-{{ $item.id }}" data-search="{{ $item.title }} {{ $item.original_title }} {{ $singers }} {{ $item.year }} {{ delimit ($item.genres | default slice) " " }}" style="--hue:{{ $item.hue | default 270 }}" aria-label="查看《{{ $item.title }}》详情">
    <span class="wuyu-album">
        <span class="wuyu-album__disc" aria-hidden="true"></span>
        <span class="wuyu-album__sleeve">
            <span class="wuyu-cover">
                <span class="wuyu-cover__fallback"><b>{{ $item.title }}</b><em>{{ $singers }}</em></span>
                {{- with $cover }}<img src="{{ . | relURL }}" alt="{{ $item.title }} 封面" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.style.display='none'">{{ end }}
            </span>
        </span>
    </span>
    <span class="wuyu-caption">
        <strong>{{ $item.title }}</strong>
        <em>{{ $singers }}{{ with $item.year }} · {{ . }}{{ end }}</em>
    </span>
</button>
<template id="wuyu-{{ $item.kind }}-{{ $item.id }}">
    {{ partial "wuyu/detail-music" $item }}
</template>
