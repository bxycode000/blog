<script>
(function () {
    'use strict';
    var layout = document.querySelector('.wuyu-wrap');
    if (!layout) return;

    /* ---------- 分类 tabs ---------- */
    var tabs = Array.prototype.slice.call(layout.querySelectorAll('[data-wuyu-tab]'));
    var keyToPanel = {
        books: 'wuyu-panel-books',
        movies: 'wuyu-panel-movies',
        anime: 'wuyu-panel-anime',
        music: 'wuyu-panel-music',
        games: 'wuyu-panel-games'
    };
    var panelToKey = {
        'wuyu-panel-books': 'books',
        'wuyu-panel-movies': 'movies',
        'wuyu-panel-anime': 'anime',
        'wuyu-panel-music': 'music',
        'wuyu-panel-games': 'games'
    };

    function activateTab(key, options) {
        if (!keyToPanel[key]) key = 'books';
        tabs.forEach(function (tab) {
            var selected = tab.getAttribute('data-wuyu-tab') === key;
            tab.setAttribute('aria-selected', String(selected));
            tab.tabIndex = selected ? 0 : -1;
            var panel = document.getElementById(tab.getAttribute('aria-controls'));
            if (panel) panel.hidden = !selected;
        });
        if (options && options.focus) {
            var target = tabs.filter(function (t) { return t.getAttribute('data-wuyu-tab') === key; })[0];
            if (target) target.focus();
        }
        if (options && options.updateHash && history.replaceState) {
            history.replaceState(null, '', '#' + key);
        }
    }

    tabs.forEach(function (tab, index) {
        tab.addEventListener('click', function () {
            activateTab(tab.getAttribute('data-wuyu-tab'), { updateHash: true });
        });
        tab.addEventListener('keydown', function (event) {
            var offset = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
            if (!offset) return;
            event.preventDefault();
            var next = tabs[(index + offset + tabs.length) % tabs.length];
            activateTab(next.getAttribute('data-wuyu-tab'), { focus: true, updateHash: true });
        });
    });

    function syncFromHash() {
        var key = decodeURIComponent((location.hash || '').replace('#', ''));
        if (panelToKey[key]) key = panelToKey[key];
        if (keyToPanel[key]) activateTab(key);
    }

    /* ---------- 搜索过滤 + 分批显示 ---------- */
    var PAGE_SIZE = 72;
    Array.prototype.forEach.call(layout.querySelectorAll('.wuyu-panel'), function (panel) {
        var input = panel.querySelector('[data-wuyu-search]');
        var grid = panel.querySelector('[data-wuyu-grid]');
        if (!input || !grid) return;
        var cards = Array.prototype.slice.call(grid.querySelectorAll('.wuyu-card'));
        var empty = panel.querySelector('[data-wuyu-empty]');
        var limit = PAGE_SIZE;
        var more = null;

        if (cards.length > PAGE_SIZE) {
            more = document.createElement('button');
            more.type = 'button';
            more.className = 'wuyu-more';
            grid.after(more);
            more.addEventListener('click', function () {
                limit += PAGE_SIZE;
                render();
            });
        }

        function render() {
            var query = input.value.trim().toLowerCase();
            var shown = 0;
            cards.forEach(function (card, index) {
                var haystack = (card.getAttribute('data-search') || '').toLowerCase();
                var match = !query || haystack.indexOf(query) !== -1;
                var visible = match && (query ? true : index < limit);
                card.hidden = !visible;
                if (visible) shown += 1;
            });
            if (empty) empty.classList.toggle('is-visible', shown === 0);
            if (more) {
                if (query || limit >= cards.length) {
                    more.hidden = true;
                } else {
                    more.hidden = false;
                    more.textContent = '显示更多（还有 ' + (cards.length - limit) + ' 条）';
                }
            }
        }

        input.addEventListener('input', render);
        render();
    });

    /* ---------- 详情弹窗 ---------- */
    var modal = document.createElement('div');
    modal.className = 'wuyu-modal';
    modal.setAttribute('aria-hidden', 'true');
    modal.innerHTML = [
        '<button class="wuyu-modal__nav wuyu-modal__nav--prev" type="button" aria-label="上一个">‹</button>',
        '<div class="wuyu-modal__dialog" role="dialog" aria-modal="true" tabindex="-1">',
        '<button class="wuyu-modal__close" type="button" aria-label="关闭详情">×</button>',
        '<div class="wuyu-modal__content"></div>',
        '</div>',
        '<button class="wuyu-modal__nav wuyu-modal__nav--next" type="button" aria-label="下一个">›</button>'
    ].join('');
    document.body.appendChild(modal);

    var dialog = modal.querySelector('.wuyu-modal__dialog');
    var content = modal.querySelector('.wuyu-modal__content');
    var prevButton = modal.querySelector('.wuyu-modal__nav--prev');
    var nextButton = modal.querySelector('.wuyu-modal__nav--next');
    var siblings = [];
    var currentIndex = -1;
    var returnFocus = null;

    function currentAccent() {
        var card = siblings[currentIndex];
        if (!card) return '';
        var cls = card.className;
        var kind = cls.indexOf('wuyu-card--books') !== -1 ? 'books'
            : cls.indexOf('wuyu-card--movies') !== -1 ? 'movies'
            : cls.indexOf('wuyu-card--anime') !== -1 ? 'anime' : 'music';
        var map = { books: '--wuyu-books', movies: '--wuyu-movies', anime: '--wuyu-anime', music: '--wuyu-music' };
        return getComputedStyle(document.body).getPropertyValue(map[kind]).trim();
    }

    function showCard(index) {
        var card = siblings[index];
        var template = card && document.getElementById(card.getAttribute('data-wuyu-open'));
        if (!template) return;
        currentIndex = index;
        content.replaceChildren(template.content.cloneNode(true));
        modal.style.setProperty('--wuyu-accent', currentAccent());
        dialog.setAttribute('aria-label', card.getAttribute('aria-label') || '详情');
        dialog.scrollTop = 0;
        prevButton.disabled = index <= 0;
        nextButton.disabled = index >= siblings.length - 1;
    }

    function openModal(card) {
        siblings = Array.prototype.slice.call(card.closest('[data-wuyu-grid]').querySelectorAll('.wuyu-card:not([hidden])'));
        returnFocus = card;
        showCard(siblings.indexOf(card));
        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
        document.body.classList.add('wuyu-modal-open');
        dialog.focus();
    }

    function closeModal() {
        content.replaceChildren();
        modal.classList.remove('is-open');
        modal.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('wuyu-modal-open');
        if (returnFocus) returnFocus.focus();
    }

    layout.addEventListener('click', function (event) {
        var card = event.target.closest('[data-wuyu-open]');
        if (card) openModal(card);
    });

    modal.addEventListener('click', function (event) {
        if (event.target === modal || event.target.closest('.wuyu-modal__close')) {
            closeModal();
        } else if (event.target === prevButton) {
            showCard(currentIndex - 1);
        } else if (event.target === nextButton) {
            showCard(currentIndex + 1);
        }
    });

    document.addEventListener('keydown', function (event) {
        if (!modal.classList.contains('is-open')) return;
        if (event.key === 'Escape') {
            closeModal();
        } else if (event.key === 'ArrowLeft' && currentIndex > 0) {
            showCard(currentIndex - 1);
        } else if (event.key === 'ArrowRight' && currentIndex < siblings.length - 1) {
            showCard(currentIndex + 1);
        }
    });

    // 深链：#item-wuyu-book-1082154 直接打开对应详情
    function openItemFromHash() {
        var raw = decodeURIComponent((location.hash || '').replace('#', ''));
        if (raw.indexOf('item-') !== 0) return;
        var id = raw.slice(5);
        var card = layout.querySelector('[data-wuyu-open="' + id + '"]');
        if (!card) return;
        var panel = card.closest('.wuyu-panel');
        if (panel && panelToKey[panel.id]) activateTab(panelToKey[panel.id]);
        openModal(card);
    }

    syncFromHash();
    openItemFromHash();
    window.addEventListener('hashchange', function () {
        syncFromHash();
        openItemFromHash();
    });
})();
</script>
